name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifie la syntaxe du Worker
        run: node --check worker/worker.js
      - name: Tests de la logique de synchro
        run: node --test
